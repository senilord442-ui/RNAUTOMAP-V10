name: Build RNAUTOMAP V10.3

on:
  workflow_dispatch:
  push:
    branches: ["utama"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V10.3 source ZIP
        shell: bash
        run: |
          rm -rf source
          mkdir -p source
          unzip -q RNAUTOMAP-V10.3-SOURCE.zip -d source
          PROJECT_DIR="$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build V10.3 debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.7/bin/gradle --no-daemon --stacktrace assembleDebug

      - name: Upload V10.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V10.3-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
