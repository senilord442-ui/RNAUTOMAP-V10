name: Build RNAUTOMAP V10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK RNAUTOMAP V10
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cari ZIP V10.1
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname 'RNAUTOMAP-V10.1-FINAL.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RNAUTOMAP-V10.1-FINAL.zip tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project V10.1
        shell: bash
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o "$ZIP_PATH" -d build_project

          echo "Isi project:"
          find build_project -maxdepth 4 -type f | sort

      - name: Cari Android project
        shell: bash
        run: |
          SETTINGS=$(find build_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find build_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project Android:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cek Android SDK bawaan runner
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo ""
          echo "SDK:"
          ls -lah "$ANDROID_SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          find "$ANDROID_SDK_ROOT" \
            -type f \
            -name sdkmanager \
            | head -n 10

      - name: Terima lisensi Android
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

      - name: Pastikan Android API 35 tersedia
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK V10
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Cari APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Hasil build:"
            find "$PROJECT_DIR" \
              -type f \
              | grep -E '\.apk$' || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/RNAUTOMAP-V10-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V10-debug-APK
          path: RNAUTOMAP-V10-debug.apk
          if-no-files-found: error
