name: Build RNAUTOMAP V10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK RNAUTOMAP V10
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Ambil isi repository
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. Cari ZIP V10.1
      # ==============================
      - name: Cari ZIP V10.1
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname 'RNAUTOMAP-V10.1-FINAL.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RNAUTOMAP-V10.1-FINAL.zip tidak ditemukan."
            echo ""
            echo "File di repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      # ==============================
      # 3. Extract project
      # ==============================
      - name: Extract project V10.1
        shell: bash
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o "$ZIP_PATH" -d build_project

          echo ""
          echo "Project setelah extract:"
          find build_project -maxdepth 4 -type f | sort

      # ==============================
      # 4. Cari settings.gradle
      # ==============================
      - name: Cari Android project
        shell: bash
        run: |
          SETTINGS=$(find build_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."

            echo ""
            echo "Isi project:"
            find build_project -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==============================
      # 5. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==============================
      # 6. Android SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # ==============================
      # 7. Gradle
      # ==============================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==============================
      # 8. Cek project
      # ==============================
      - name: Cek project Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Project:"
          pwd

          echo ""
          echo "Isi project:"
          ls -lah

          echo ""
          echo "build.gradle:"
          cat build.gradle

          echo ""
          echo "app/build.gradle:"
          cat app/build.gradle

      # ==============================
      # 9. Build APK
      # ==============================
      - name: Build APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      # ==============================
      # 10. Cari APK
      # ==============================
      - name: Cari hasil APK
        shell: bash
        run: |
          echo "Mencari APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "File hasil build:"
            find "$PROJECT_DIR" \
              -type f \
              | grep -E '\.(apk|aab)$' || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/RNAUTOMAP-V10-debug.apk"

      # ==============================
      # 11. Upload APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V10-debug-APK
          path: RNAUTOMAP-V10-debug.apk
          if-no-files-found: error

