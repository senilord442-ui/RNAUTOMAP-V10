name: Build RNAUTOMAP V11.1.12 FIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FIX source
        shell: bash
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q "RNAUTOMAP-V11.1.12-DATA-PARSER-TPS-FIX.zip" -d build-src

          test -f build-src/settings.gradle
          test -f build-src/app/build.gradle
          test -f build-src/app/src/main/java/com/rnautomap/juken/MainActivity.java

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build-src
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="build-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.12-DATA-PARSER-TPS-FIX-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
