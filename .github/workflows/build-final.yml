name: Build RNAUTOMAP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "=== ROOT ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure OK"

      - name: Check JUKEN protocol
        shell: bash
        run: |
          set -e

          MAIN=$(find app/src/main/java -name "MainActivity.java" | head -1)

          test -n "$MAIN"

          grep -q "00001101-0000-1000-8000-00805F9B34FB" "$MAIN"
          grep -q "createBond" "$MAIN"
          grep -q "BOND_BONDED" "$MAIN"
          grep -q "160A" "$MAIN"
          grep -q "160B" "$MAIN"

          echo "JUKEN protocol checks PASS"

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== APK FILES ==="
          find app/build/outputs -type f -name "*.apk" -print

          APK=$(find app/build/outputs -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-JUKEN-V11.1.16-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
