name: RNAUTOMAP FINAL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RNAUTOMAP
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          printf '%s\n' \
          y y y y y y y y y y y y y y y y y y y y \
          y y y y y y y y y y y y y y y y y y y y \
          > /tmp/licenses.txt

          "$SDKMANAGER" --licenses < /tmp/licenses.txt || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find RNAUTOMAP source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI SOURCE RNAUTOMAP"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -print

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "RNAUTOMAP-JUKEN-*.zip" \
            ! -iname "*debug*.zip" \
            ! -iname "*release*.zip" \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              | sort \
              | tail -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: SOURCE ZIP TIDAK DITEMUKAN."
            echo "Upload source ZIP RNAUTOMAP ke repository."
            exit 1
          fi

          echo ""
          echo "SOURCE YANG DIPAKAI:"
          echo "$ZIP_FILE"

          echo "$ZIP_FILE" > "$GITHUB_WORKSPACE/source_zip.txt"

      - name: Extract source
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(cat "$GITHUB_WORKSPACE/source_zip.txt")

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/source"

          echo "=========================================="
          echo "SOURCE HASIL EKSTRAK"
          echo "=========================================="

          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "build.gradle" \
              -o -name "app.html" \
            \) \
            -print

      - name: Detect Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -exec dirname {} \; \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo ""
            echo "Struktur source:"
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 5 \
              -print
            exit 1
          fi

          echo "PROJECT:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" \
            > "$GITHUB_WORKSPACE/project_dir.txt"

      - name: Verify RNAUTOMAP source
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY SOURCE"
          echo "=========================================="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html

          echo ""
          echo "SOURCE RNAUTOMAP = OK"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Clean
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD APK RNAUTOMAP"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "=========================================="
          echo "MENCARI APK"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK TIDAK DITEMUKAN."
            exit 1
          fi

          echo "$APK" \
            > "$GITHUB_WORKSPACE/apk_path.txt"

          echo ""
          echo "=========================================="
          echo "BUILD BERHASIL"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-FINAL-APK
          path: source/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Finish
        run: |
          echo "=========================================="
          echo "RNAUTOMAP BUILD SELESAI"
          echo "=========================================="
