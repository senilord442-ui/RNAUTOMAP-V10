name: Build JUKEN MOD MAX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "JUKEN-MOD-MAX-SOURCE.zip"
      - ".github/workflows/build-juken-mod.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Find source ZIP
        id: findzip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 3 -type f \
            \( -iname 'JUKEN-MOD-MAX-SOURCE.zip' \
            -o -iname '*JUKEN-MOD-MAX*.zip' \) \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: JUKEN MOD MAX ZIP tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/juken-source"
          mkdir -p "$RUNNER_TEMP/juken-source"

          unzip -q "${{ steps.findzip.outputs.zip }}" \
            -d "$RUNNER_TEMP/juken-source"

          echo "Hasil extract:"
          find "$RUNNER_TEMP/juken-source" -maxdepth 4 -type f | sort | head -200

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/juken-source"

          SETTINGS="$(find "$ROOT" -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo "Struktur source:"
            find "$ROOT" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle || test -f settings.gradle.kts

          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan."
            echo "Isi project:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle:"
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find . -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p "$RUNNER_TEMP/apk"
          cp "$APK" "$RUNNER_TEMP/apk/JUKEN-MOD-MAX-debug.apk"

          echo "apk_path=$RUNNER_TEMP/apk/JUKEN-MOD-MAX-debug.apk" \
            >> "$GITHUB_OUTPUT"

      - name: SHA256
        shell: bash
        run: |
          sha256sum "${{ steps.apk.outputs.apk_path }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUKEN-MOD-MAX-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
