name: Build RNAUTOMAP APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Extract V11.1.12 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \
            -name 'RNAUTOMAP-JUKEN-V11.1.12-ECU-DATA-AUTOTUNE.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP V11.1.12 tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          rm -rf _android_project
          mkdir -p _android_project

          unzip -q "$ZIP_FILE" -d _android_project

          echo "Isi project:"
          find _android_project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/_android_project" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find _android_project -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project Android ditemukan:"
          echo "$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building dari:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle clean assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Build selesai tetapi APK tidak ditemukan."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/RNAUTOMAP-V11.1.12-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/RNAUTOMAP-V11.1.12-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.12-ECU-DATA-AUTOTUNE
          path: apk-output/RNAUTOMAP-V11.1.12-debug.apk
