name: RNAUTOMAP V11.1.6 FINAL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RNAUTOMAP V11.1.6
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          printf '%s\n' \
            y y y y y y y y y y y y y y y y y y y y \
            y y y y y y y y y y y y y y y y y y y y \
            > /tmp/android-licenses.txt

          "$SDKMANAGER" --licenses < /tmp/android-licenses.txt

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract V11.1.6 source
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/RNAUTOMAP-JUKEN-V11.1.6-BUILDFIX-SOURCE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP V11.1.6 tidak ditemukan."
            echo "File yang tersedia:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          echo "SOURCE BERHASIL DIEKSTRAK"

      - name: Detect Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -exec dirname {} \; \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "$PROJECT_DIR" > "$GITHUB_WORKSPACE/project_dir.txt"

          echo "PROJECT:"
          cat "$GITHUB_WORKSPACE/project_dir.txt"

      - name: Verify source
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")
          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html

          echo "SOURCE V11.1.6 = OK"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")
          cd "$PROJECT_DIR"

          gradle clean --no-daemon --stacktrace

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")
          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "======================================"
          echo "MENCARI APK HASIL BUILD"
          echo "======================================"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "$APK" > "$GITHUB_WORKSPACE/apk_path.txt"

          echo ""
          echo "======================================"
          echo "APK BERHASIL DIBUAT"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.6-FINAL-APK
          path: ${{ github.workspace }}/source/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build complete
        run: |
          echo "======================================"
          echo "RNAUTOMAP V11.1.6 SELESAI"
          echo "======================================"
          echo "APK sudah tersedia di Artifacts."
