name: RNAUTOMAP V11.1.5 FINAL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RNAUTOMAP V11.1.5
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          echo "Menerima lisensi..."

          for i in $(seq 1 100); do
            echo y
          done | "$SDKMANAGER" --licenses || true

          echo "Install SDK Android 35..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID SDK SIAP"

      # ==========================================
      # 4. CARI DAN EKSTRAK SOURCE ZIP
      # ==========================================
      - name: Extract RNAUTOMAP source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI SOURCE ZIP"
          echo "=========================================="

          find . -maxdepth 3 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FILE ZIP SOURCE TIDAK DITEMUKAN."
            exit 1
          fi

          echo "ZIP SOURCE:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          echo "=========================================="
          echo "ISI HASIL EKSTRAK"
          echo "=========================================="

          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 5 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print

      # ==========================================
      # 5. DETEKSI ROOT PROJECT ANDROID
      # ==========================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI ROOT PROJECT ANDROID"
          echo "=========================================="

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -exec dirname {} \; \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo "Isi source:"
            find "$GITHUB_WORKSPACE/source" -maxdepth 5 -print
            exit 1
          fi

          echo "PROJECT DITEMUKAN:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > "$GITHUB_WORKSPACE/project_dir.txt"

      # ==========================================
      # 6. VERIFIKASI SOURCE
      # ==========================================
      - name: Verify source
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "=========================================="
          echo "VERIFY RNAUTOMAP SOURCE"
          echo "=========================================="

          cd "$PROJECT_DIR"

          echo "PROJECT:"
          pwd

          echo ""
          echo "FILES:"
          ls -la

          test -f settings.gradle || test -f settings.gradle.kts

          test -f build.gradle || test -f build.gradle.kts

          test -f app/build.gradle || test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

          test -f app/src/main/assets/app.html

          test -f app/src/main/assets/kalkulator-peta-ecu.html

          echo ""
          echo "SOURCE V11.1.5 = OK"

      # ==========================================
      # 7. SETUP GRADLE 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 8. CHECK GRADLE
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

      # ==========================================
      # 9. CLEAN
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CLEAN"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 10. BUILD APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD RNAUTOMAP V11.1.5"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 11. CARI APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "=========================================="
          echo "HASIL APK"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK TIDAK DITEMUKAN."
            exit 1
          fi

          echo "$APK" > "$GITHUB_WORKSPACE/apk_path.txt"

          echo ""
          echo "APK BERHASIL DIBUAT:"
          ls -lh "$APK"

      # ==========================================
      # 12. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.5-FINAL-APK
          path: ${{ github.workspace }}/source/**/app/build/outputs/apk/*.apk
          if-no-files-found: error

      # ==========================================
      # 13. SELESAI
      # ==========================================
      - name: Build finished
        run: |
          echo "=========================================="
          echo "RNAUTOMAP V11.1.5 BUILD SELESAI"
          echo "=========================================="
