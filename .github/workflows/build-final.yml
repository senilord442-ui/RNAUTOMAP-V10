name: RNAUTOMAP V11.1.8 FINAL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RNAUTOMAP V11.1.8
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Install / cek Android SDK..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK siap."

      # ==========================================
      # 4. CARI SOURCE V11.1.8
      # ==========================================
      - name: Locate V11.1.8 source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI SOURCE V11.1.8"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*V11.1.8*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: ZIP V11.1.8 TIDAK DITEMUKAN."
            echo ""
            echo "Pastikan file source V11.1.8 sudah di-upload ke repository."
            exit 1
          fi

          echo ""
          echo "SOURCE YANG DIPAKAI:"
          echo "$ZIP_FILE"

          echo "$ZIP_FILE" > "$GITHUB_WORKSPACE/source_zip.txt"

      # ==========================================
      # 5. EXTRACT SOURCE
      # ==========================================
      - name: Extract source
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(cat "$GITHUB_WORKSPACE/source_zip.txt")

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          echo "Extract:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/source"

          echo ""
          echo "Source berhasil diekstrak."

      # ==========================================
      # 6. DETECT ANDROID PROJECT
      # ==========================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DETECT ANDROID PROJECT"
          echo "=========================================="

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -exec dirname {} \; \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo ""
            echo "Isi source:"
            find "$GITHUB_WORKSPACE/source" \
              -maxdepth 5 \
              -type f \
              -print
            exit 1
          fi

          echo "PROJECT:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > "$GITHUB_WORKSPACE/project_dir.txt"

      # ==========================================
      # 7. VERIFY SOURCE
      # ==========================================
      - name: Verify RNAUTOMAP source
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY SOURCE"
          echo "=========================================="

          test -f settings.gradle || \
          test -f settings.gradle.kts

          test -f build.gradle || \
          test -f build.gradle.kts

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

          test -f app/src/main/assets/app.html

          test -f app/src/main/assets/kalkulator-peta-ecu.html

          echo ""
          echo "SOURCE RNAUTOMAP = OK"

      # ==========================================
      # 8. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 9. CHECK GRADLE
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

      # ==========================================
      # 10. CLEAN
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CLEAN"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 11. BUILD APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD RNAUTOMAP V11.1.8"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 12. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "=========================================="
          echo "MENCARI APK"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "$APK" > "$GITHUB_WORKSPACE/apk_path.txt"

          echo ""
          echo "=========================================="
          echo "BUILD BERHASIL"
          echo "=========================================="

          ls -lh "$APK"

      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.8-FINAL-APK
          path: ${{ github.workspace }}/source/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ==========================================
      # 14. SELESAI
      # ==========================================
      - name: Build complete
        run: |
          echo "=========================================="
          echo "RNAUTOMAP V11.1.8 SELESAI"
          echo "=========================================="
          echo ""
          echo "APK sudah masuk ke Artifacts."
