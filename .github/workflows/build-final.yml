name: RNAUTOMAP V11.1.5 FINAL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan:"
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager ditemukan:"
          "$SDKMANAGER" --version

          echo "Menerima lisensi Android SDK..."
          yes | "$SDKMANAGER" --licenses >/dev/null

          echo "Install Android SDK 35..."
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK siap."

      - name: Verify V11.1.5 source
        working-directory: v115
        shell: bash
        run: |
          set -e

          echo "=== PROJECT ==="
          pwd
          ls -la

          echo "=== CEK FILE ==="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

          echo "SOURCE V11.1.5 OK"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle and Android
        working-directory: v115
        shell: bash
        run: |
          set -e

          gradle --version

          echo "ANDROID:"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Clean
        working-directory: v115
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon --stacktrace

      - name: Build APK
        working-directory: v115
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: v115
        shell: bash
        run: |
          set -e

          echo "=== HASIL BUILD ==="

          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "================================"
          echo "BUILD BERHASIL"
          echo "================================"

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.5-FINAL-APK
          path: v115/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
