name: Build RNAUTOMAP V11.1.16 JUKEN PAIR FIRST

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "=== PROJECT ==="
          find . -maxdepth 3 -type f | sort | head -200

      - name: Protocol safety checks
        shell: bash
        run: |
          set -e

          MAIN=$(find app/src/main/java -name "MainActivity.java" | head -1)

          test -n "$MAIN"

          grep -q '00001101-0000-1000-8000-00805F9B34FB' "$MAIN"
          grep -q 'BOND_BONDED' "$MAIN"
          grep -q 'createBond' "$MAIN"
          grep -q '160A' "$MAIN"
          grep -q '160B' "$MAIN"
          grep -q '1616' "$MAIN"
          grep -q '9616' "$MAIN"
          grep -q '1500' "$MAIN"
          grep -q '9500' "$MAIN"
          grep -q '1B00' "$MAIN"
          grep -q '1b01' "$MAIN"

          echo "JUKEN PAIR-FIRST protocol checks: PASS"

      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          if command -v node >/dev/null 2>&1; then
            node --check app/src/main/assets/app.html 2>/dev/null || true
          fi

          grep -q 'pairAndConnect' app/src/main/assets/app.html
          grep -q 'btPairingStarted' app/src/main/assets/app.html
          grep -q 'btBonded' app/src/main/assets/app.html

          echo "UI pairing checks: PASS"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle --version
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          find app/build/outputs/apk -type f -name "*.apk" -print

          test -n "$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.16-JUKEN-PAIR-FIRST-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
