name: RNAUTOMAP FINAL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RNAUTOMAP FINAL
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # =========================================
      # 1. CHECKOUT
      # =========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================
      # 2. JAVA 17
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================
      # 3. ANDROID SDK
      # =========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Menerima lisensi Android SDK..."

          for i in $(seq 1 100); do
            echo y
          done | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Install Android SDK..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID SDK SIAP"

      # =========================================
      # 4. CARI SOURCE ZIP TERBARU
      # =========================================
      - name: Find latest RNAUTOMAP source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI SOURCE RNAUTOMAP"
          echo "======================================"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "RNAUTOMAP-JUKEN-*.zip" \
            -print

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "RNAUTOMAP-JUKEN-*.zip" \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SOURCE ZIP RNAUTOMAP TIDAK DITEMUKAN"
            exit 1
          fi

          echo ""
          echo "SOURCE YANG DIPAKAI:"
          echo "$ZIP_FILE"

          echo "$ZIP_FILE" > "$GITHUB_WORKSPACE/source_zip.txt"

      # =========================================
      # 5. EXTRACT SOURCE
      # =========================================
      - name: Extract source
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(cat "$GITHUB_WORKSPACE/source_zip.txt")

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/source"

          echo "======================================"
          echo "SOURCE BERHASIL DIEKSTRAK"
          echo "======================================"

          find "$GITHUB_WORKSPACE/source" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "build.gradle" \
              -o -name "MainActivity.java" \
            \) \
            -print

      # =========================================
      # 6. DETEKSI ROOT ANDROID
      # =========================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -exec dirname {} \; \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: PROJECT ANDROID TIDAK DITEMUKAN"
            find "$GITHUB_WORKSPACE/source" -maxdepth 6 -print
            exit 1
          fi

          echo "$PROJECT_DIR" \
            > "$GITHUB_WORKSPACE/project_dir.txt"

          echo "======================================"
          echo "PROJECT ANDROID:"
          echo "$PROJECT_DIR"
          echo "======================================"

      # =========================================
      # 7. VERIFIKASI SOURCE
      # =========================================
      - name: Verify source
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERIFY SOURCE"
          echo "======================================"

          test -f settings.gradle || \
          test -f settings.gradle.kts

          test -f build.gradle || \
          test -f build.gradle.kts

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

          test -f app/src/main/assets/app.html

          test -f app/src/main/assets/kalkulator-peta-ecu.html

          echo ""
          echo "SOURCE = OK"

      # =========================================
      # 8. GRADLE 8.9
      # =========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================
      # 9. CHECK GRADLE
      # =========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GRADLE"
          echo "======================================"

          gradle --version

      # =========================================
      # 10. CLEAN
      # =========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "CLEAN PROJECT"
          echo "======================================"

          gradle clean \
            --no-daemon \
            --stacktrace

      # =========================================
      # 11. BUILD APK
      # =========================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILD RNAUTOMAP"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================================
      # 12. CARI APK HASIL BUILD
      # =========================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "======================================"
          echo "MENCARI APK"
          echo "======================================"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK TIDAK DITEMUKAN"
            exit 1
          fi

          echo ""
          echo "APK DITEMUKAN:"
          echo "$APK"

          echo "$APK" \
            > "$GITHUB_WORKSPACE/apk_source.txt"

      # =========================================
      # 13. SALIN APK KE LOKASI TETAP
      # =========================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          APK=$(cat "$GITHUB_WORKSPACE/apk_source.txt")

          rm -rf "$GITHUB_WORKSPACE/final-apk"
          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/final-apk/RNAUTOMAP-FINAL.apk"

          echo "======================================"
          echo "APK FINAL"
          echo "======================================"

          ls -lh \
            "$GITHUB_WORKSPACE/final-apk/RNAUTOMAP-FINAL.apk"

      # =========================================
      # 14. UPLOAD APK
      # =========================================
      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-FINAL-APK
          path: final-apk/RNAUTOMAP-FINAL.apk
          if-no-files-found: error

      # =========================================
      # 15. SELESAI
      # =========================================
      - name: Build complete
        run: |
          echo ""
          echo "======================================"
          echo "RNAUTOMAP BUILD BERHASIL"
          echo "======================================"
          echo ""
          echo "APK: RNAUTOMAP-FINAL.apk"
          echo ""
