name: Build JUKEN MOD MAX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "JUKEN-MOD-MAX-SOURCE.zip"
      - ".github/workflows/build-final.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find JUKEN MOD source ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f \
            \( -iname 'JUKEN-MOD-MAX-SOURCE.zip' \
            -o -iname '*JUKEN-MOD-MAX*.zip' \
            \) | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: JUKEN MOD MAX ZIP tidak ditemukan."
            echo "File repository:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract JUKEN MOD source
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/juken-source"
          mkdir -p "$RUNNER_TEMP/juken-source"

          unzip -q "${{ steps.find_zip.outputs.zip }}" \
            -d "$RUNNER_TEMP/juken-source"

          echo "Source hasil extract:"
          find "$RUNNER_TEMP/juken-source" -maxdepth 5 -type f | sort

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find "$RUNNER_TEMP/juken-source" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo "Struktur source:"
            find "$RUNNER_TEMP/juken-source" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew tidak ditemukan."
            echo "Isi project:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: find_apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find . -type f | sort
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p "$RUNNER_TEMP/final-apk"

          cp "$APK" \
            "$RUNNER_TEMP/final-apk/JUKEN-MOD-MAX-debug.apk"

          echo "apk=$RUNNER_TEMP/final-apk/JUKEN-MOD-MAX-debug.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.find_apk.outputs.apk }}"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUKEN-MOD-MAX-APK
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
