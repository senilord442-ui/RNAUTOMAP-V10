name: Build RNAUTOMAP V11.1.13 ECU LIVE FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build RNAUTOMAP APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cari Android Project
        shell: bash
        run: |
          set -e

          echo "=== CARI PROJECT ANDROID ==="

          SETTINGS=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo ""
            echo "Isi repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cek Source RNAUTOMAP
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== CEK SOURCE ==="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html

          echo "SOURCE OK"

      - name: Cek Protocol JUKEN
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== CEK PROTOCOL JUKEN ==="

          grep -q '00001101-0000-1000-8000-00805F9B34FB' \
            app/src/main/java/com/rnautomap/juken/MainActivity.java

          grep -q '1606' \
            app/src/main/java/com/rnautomap/juken/MainActivity.java

          grep -q '1616' \
            app/src/main/java/com/rnautomap/juken/MainActivity.java

          grep -q '1500' \
            app/src/main/java/com/rnautomap/juken/MainActivity.java

          grep -q '1B00' \
            app/src/main/java/com/rnautomap/juken/MainActivity.java

          grep -q '160A' \
            app/src/main/java/com/rnautomap/juken/MainActivity.java

          grep -q '160B' \
            app/src/main/java/com/rnautomap/juken/MainActivity.java

          echo "JUKEN PROTOCOL CHECK PASS"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== BUILD APK ==="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "================================"
          echo "BUILD BERHASIL"
          echo "================================"

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.13-ECU-LIVE-PROTOCOL-FIX-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
