name: RNAUTOMAP V11.1.5 FINAL BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK RNAUTOMAP V11.1.5
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # 1. AMBIL SOURCE DARI GITHUB
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. CEK ANDROID SDK
      # ==========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK CHECK"
          echo "=========================================="

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager latest tidak ditemukan."
            echo "Mencari sdkmanager yang tersedia..."

            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)

          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo "Versi sdkmanager:"
          "$SDKMANAGER" --version

          echo "=========================================="
          echo "ANDROID LICENSE"
          echo "=========================================="

          # Kirim banyak jawaban Y tanpa memakai
          # 'yes | sdkmanager' yang sebelumnya menyebabkan
          # Broken pipe.
          seq 1 100 | sed 's/.*/y/' | "$SDKMANAGER" --licenses

          echo "=========================================="
          echo "INSTALL ANDROID SDK"
          echo "=========================================="

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=========================================="
          echo "ANDROID SDK SIAP"
          echo "=========================================="

      # ==========================================
      # 4. CEK SOURCE V11.1.5
      # ==========================================
      - name: Verify V11.1.5 source
        working-directory: v115
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECK PROJECT"
          echo "=========================================="

          echo "Lokasi project:"
          pwd

          echo ""
          echo "Isi project:"
          ls -la

          echo ""
          echo "Cek file wajib..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

          echo ""
          echo "SEMUA FILE SOURCE DITEMUKAN."
          echo "SOURCE V11.1.5 = OK"

      # ==========================================
      # 5. INSTALL GRADLE 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 6. CEK GRADLE
      # ==========================================
      - name: Check Gradle
        working-directory: v115
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

      # ==========================================
      # 7. CEK ANDROID PLATFORM
      # ==========================================
      - name: Check Android Platform
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PLATFORM CHECK"
          echo "=========================================="

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)
          fi

          "$SDKMANAGER" --list_installed || true

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "ANDROID PLATFORM 35 = OK"
          echo "BUILD TOOLS 35.0.0 = OK"

      # ==========================================
      # 8. CLEAN PROJECT
      # ==========================================
      - name: Clean project
        working-directory: v115
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE CLEAN"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 9. BUILD APK
      # ==========================================
      - name: Build Debug APK
        working-directory: v115
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD RNAUTOMAP V11.1.5"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 10. VERIFIKASI APK
      # ==========================================
      - name: Verify APK
        working-directory: v115
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK RESULT"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK TIDAK DITEMUKAN."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "BUILD BERHASIL"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "APK:"
          echo "$APK"

      # ==========================================
      # 11. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.5-FINAL-APK
          path: v115/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ==========================================
      # 12. SELESAI
      # ==========================================
      - name: Build finished
        run: |
          echo "=========================================="
          echo "RNAUTOMAP V11.1.5 SELESAI"
          echo "=========================================="
          echo "APK tersedia di Artifacts."
