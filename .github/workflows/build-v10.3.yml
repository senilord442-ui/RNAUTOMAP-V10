name: Build RNAUTOMAP JUKEN

on:
  workflow_dispatch:
  push:
    branches:
      - utama

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Check Android project
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== REQUIRED FILES ==="
          test -f settings.gradle
          test -f build.gradle
          test -f gradlew
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

          echo "All required files found."

      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "=== APK ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "BUILD SUCCESS"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
