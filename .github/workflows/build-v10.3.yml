name: Build RNAUTOMAP JUKEN

on:
  workflow_dispatch:
  push:
    branches:
      - utama

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Check project
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== GRADLE ==="
          ls -la gradle || true
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== APK RESULT ==="
          find app/build/outputs/apk -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
