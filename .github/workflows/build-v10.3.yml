name: Build RNAUTOMAP JUKEN V11.1.5

on:
  workflow_dispatch:
  push:
    branches:
      - utama
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Check V11.1.5 project
        working-directory: v115
        run: |
          echo "=== PROJECT ==="
          pwd
          ls -la

          echo "=== REQUIRED FILES ==="
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html
          test -f app/src/main/java/com/rnautomap/juken/MainActivity.java

          echo "SOURCE CHECK: OK"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        working-directory: v115
        run: |
          gradle --version

      - name: Clean
        working-directory: v115
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: v115
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: v115
        run: |
          echo "=== APK RESULT ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "BUILD SUCCESS"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V11.1.5-debug
          path: v115/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
