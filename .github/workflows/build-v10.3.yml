name: Build RNAUTOMAP JUKEN V11

on:
  workflow_dispatch:
  push:
    branches:
      - utama
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cari ZIP V11
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP V11 tidak ditemukan."
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP V11
        shell: bash
        run: |
          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "=== HASIL EXTRACT ==="
          find source -maxdepth 3 -type f | sort

      - name: Cari folder project Android
        shell: bash
        run: |
          PROJECT_DIR=$(find source -type f \
            -name "settings.gradle" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle tidak ditemukan."
            find source -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cek source V11
        shell: bash
        run: |
          echo "=== PROJECT ==="
          ls -la "$PROJECT_DIR"

          echo "=== APP ==="
          find "$PROJECT_DIR/app" -maxdepth 5 -type f | sort

          test -f "$PROJECT_DIR/app/src/main/assets/app.html"
          test -f "$PROJECT_DIR/app/src/main/assets/kalkulator-peta-ecu.html"

          echo "app.html OK"
          echo "kalkulator OK"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          rm -rf /tmp/gradle-8.9

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Build APK V11
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Cek APK
        shell: bash
        run: |
          echo "=== APK ==="
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/"

          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "APK BERHASIL DIBUAT"

      - name: Upload APK V11
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-JUKEN-V11-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
