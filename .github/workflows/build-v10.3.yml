name: Build RNAUTOMAP JUKEN V11

on:
  workflow_dispatch:
  push:
    branches:
      - utama
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Check V11 source
        shell: bash
        run: |
          echo "=== PROJECT ==="
          ls -la

          echo "=== APP ==="
          find app -maxdepth 5 -type f | sort

          echo "=== CHECK ASSETS ==="

          test -f app/src/main/assets/app.html
          test -f app/src/main/assets/kalkulator-peta-ecu.html

          echo "app.html OK"
          echo "kalkulator-peta-ecu.html OK"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          rm -rf /tmp/gradle-8.7

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.7/bin/gradle --version

      - name: Build V11 Debug APK
        shell: bash
        run: |
          /tmp/gradle-8.7/bin/gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Check APK
        shell: bash
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK BERHASIL DIBUAT"

      - name: Upload V11 APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-JUKEN-V11-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
